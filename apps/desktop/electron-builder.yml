appId: uk.co.nsawill.whirl
productName: Whirl
executableName: whirl
copyright: Copyright © William North
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  - from: ../web/dist
    to: web
  - from: ../../packages/mcp/dist/index.js
    to: mcp/index.mjs
icon: ../web/public/icon-512.png
artifactName: Whirl-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Graphics
  maintainer: William North <williamnorth1405@gmail.com>
  target: [AppImage, deb]
